
<div *ngIf="todos.length > 0"  class="task-container">
    <div class="container-row" *ngFor="let todo of todos">
        <span class="td category-tbl"> 
            <select [(ngModel)]="todo.taskStatus"  class="select-category" (change)="updateTodo(todo)" >
                <option class="options" *ngFor="let status of taskStatus" [value]="status" >{{status}}</option>
            </select>
        </span>

        <span class="td task-tbl" >
            <input type="text" [(ngModel)]="todo.taskName" class="task-input" (blur)="updateTodo(todo)" (keyup.enter)="updateTodo(todo)"/>
            
            <span class="td date-tbl">{{todo.dateAdded | date:' HH:mm MM/dd/yyyy'}}</span>
        </span>
        
        <span class="td button-tbl"> 
            <fa-icon [icon]="faPenToSquare" id="edit" matTooltip="Edit" >
                
            </fa-icon>
            |  
            <fa-icon [icon]="faTrash" id="del" (click)="deleteTodo(todo.id)" matTooltip="Delete" ></fa-icon>
            

        </span>
        
    </div>
</div>


<p *ngIf="!todos || todos.length ===0">No Task Yet</p>
